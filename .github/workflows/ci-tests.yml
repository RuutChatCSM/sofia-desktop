name: Sofia Tests

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sofia-tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Install Sofia CLI
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOFIA_ENGINE_GITHUB_REPO: ${{ vars.SOFIA_ENGINE_GITHUB_REPO || 'anomalyco/engine' }}
        run: |
          set -euo pipefail

          repo="${SOFIA_ENGINE_GITHUB_REPO:-anomalyco/engine}"
          version="$(node -e "const fs=require('fs'); const parsed=JSON.parse(fs.readFileSync('constants.json','utf8')); process.stdout.write(String(parsed.engineVersion||'').trim().replace(/^v/,''));")"
          version="$(echo "$version" | tr -d '\r\n' | sed 's/^v//')"

          if [ -z "$version" ]; then
            echo "Unable to resolve Sofia version from constants.json." >&2
            exit 1
          fi

          arch="$(uname -m)"
          case "${RUNNER_OS}" in
            Linux)
              if [ "$arch" = "aarch64" ] || [ "$arch" = "arm64" ]; then
                engine_asset="engine-linux-arm64.tar.gz"
              else
                engine_asset="engine-linux-x64-baseline.tar.gz"
              fi
              ;;
            macOS)
              if [ "$arch" = "arm64" ]; then
                engine_asset="engine-darwin-arm64.zip"
              else
                engine_asset="engine-darwin-x64-baseline.zip"
              fi
              ;;
            *)
              echo "Unsupported OS: ${RUNNER_OS}" >&2
              exit 1
              ;;
          esac

          url="https://github.com/${repo}/releases/download/v${version}/${engine_asset}"
          tmp_dir="$RUNNER_TEMP/engine"
          extract_dir="$tmp_dir/extracted"
          rm -rf "$tmp_dir"
          mkdir -p "$extract_dir"

          curl_headers=()
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            curl_headers+=( -H "Authorization: Bearer ${GITHUB_TOKEN}" )
          fi

          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "${curl_headers[@]}" -o "$tmp_dir/$engine_asset" "$url"

          if [[ "$engine_asset" == *.tar.gz ]]; then
            tar -xzf "$tmp_dir/$engine_asset" -C "$extract_dir"
          else
            unzip -q "$tmp_dir/$engine_asset" -d "$extract_dir"
          fi

          if [ -f "$extract_dir/engine" ]; then
            bin_path="$extract_dir/engine"
          elif [ -f "$extract_dir/engine.exe" ]; then
            bin_path="$extract_dir/engine.exe"
          else
            echo "Sofia binary not found in archive" >&2
            ls -la "$extract_dir"
            exit 1
          fi

          install_dir="$HOME/.sofia/bin"
          mkdir -p "$install_dir"
          cp "$bin_path" "$install_dir/engine"
          chmod 755 "$install_dir/engine"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Verify Sofia
        run: engine --version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml', 'evals/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Install eval workspace
        run: pnpm --dir evals install --frozen-lockfile --prefer-offline

      - name: Run eval spec lane
        run: pnpm --dir evals run test:pr

      - name: Run app unit tests
        run: pnpm --filter @sofia/app test

      - name: Run server unit tests
        run: pnpm --filter sofia-server test

      - name: Run desktop unit tests
        run: pnpm --filter @sofia/desktop test

      - name: Run release script tests
        run: node --test scripts/release/*.test.mjs

      - name: Run eval runner unit tests
        run: pnpm test:eval-runner

      - name: Check outbound access manifest
        run: pnpm check:outbound-access

      # The packaged builds bundle the server plugins with `--target node`,
      # which resolves workspace packages through their published exports
      # rather than TypeScript paths. Typechecks and bun tests never take that
      # route, so an unbuildable import reached dev twice before this ran here.
      - name: Bundle the server plugins the way packaged builds do
        run: |
          set -euo pipefail
          rm -rf packages/types/dist
          pnpm --filter sofia-server build

      - name: Typecheck Electron main against the IPC contract
        run: pnpm --filter @sofia/desktop typecheck:electron

      - name: Run e2e tests
        run: pnpm --filter @sofia/app test:e2e

  # Single stable context for branch rulesets to require. Green only when
  # every sofia-tests matrix leg succeeded; runs even when legs fail or
  # are cancelled so the required check always reports instead of hanging.
  sofia-tests-required:
    needs: sofia-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every sofia-tests matrix leg to pass
        env:
          RESULT: ${{ needs.sofia-tests.result }}
        run: |
          echo "sofia-tests result: $RESULT"
          if [ "$RESULT" != "success" ]; then
            echo "One or more Sofia Tests matrix legs did not succeed; blocking merge." >&2
            exit 1
          fi
